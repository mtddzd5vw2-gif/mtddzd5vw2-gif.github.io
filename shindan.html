<main><h2>言霊診断</h2><p class="lead">名前や好きな言葉を書くと、その言葉に宿る電獣の影がわかる。だれが書いても、同じ答え。</p>
<form id="sd-f" class="sd-form"><input id="sd-w" maxlength="12" placeholder="例：自分の名前、推し、晩ごはん" autocomplete="off" enterkeyhint="go" aria-label="診断する言葉"><button class="cta" type="submit">診断する</button></form>
<p class="sd-today">今日の言霊：<button type="button" id="sd-today"></button></p>
<section id="sd-out" class="sd-out" hidden aria-live="polite"></section>
<h3>電獣とは</h3><p>街の電線に眠る霊獣。アプリ『電獣』の言霊召喚で言葉を札に書くと、この診断と同じ電獣が目覚める。姿・位・色違い・名前は、召喚するまでわからない。</p>
<p><a href="./">電獣のページへ</a></p></main>
<script>var DENJU_LANG = 'ja';</script><script src="js/denju-core.js"></script><script>
(function () {
  var f = document.getElementById('sd-f'), inp = document.getElementById('sd-w'), out = document.getElementById('sd-out'), td = document.getElementById('sd-today');
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  function show(raw, push) {
    var w = normWord(raw); if (!w) { inp.focus(); return; }
    var d = makeDNA(WORD_LINE, w), E = ELEMENTS[d.el], K = KINDS[d.kind];
    var text = '「' + w + '」に宿る電獣は、' + E.k + 'の' + K.k + 'の影。あなたの言葉には、なにが眠ってる？ #言霊診断 #電獣';
    out.innerHTML = '<div class="sd-card" style="--c:' + E.col + ';--m:url(img/sil_' + d.kind + '.png)"><div class="sd-word">「' + esc(w) + '」</div><div class="sd-sub">に宿るのは</div><div class="sd-sil" role="img" aria-label="' + E.k + 'の' + K.k + 'の影"></div>'
      + '<p class="sd-line"><b>' + E.k + '</b>（' + E.read + '）の<b>' + K.k + '</b>の影</p><p class="sd-note">姿・位・色違い・名前は、アプリで「' + esc(w) + '」と書いて召喚するまでわからない。</p>'
      + '<div class="sd-act"><a class="cta sd-x" target="_blank" rel="noopener" href="https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent('https://mtddzd5vw2-gif.github.io/shindan.html') + '">X でシェア</a><a class="cta" href="https://apps.apple.com/jp/app/id6816935558">アプリで召喚する</a></div></div>';
    out.hidden = false; inp.value = w;
    if (push !== false) try { history.replaceState(null, '', '?w=' + encodeURIComponent(w)); } catch (e) {}
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); show(inp.value); });
  var dw = dailyWord(); td.textContent = dw; td.addEventListener('click', function () { show(dw); });
  var q = new URLSearchParams(location.search).get('w'); if (q) show(q, false);
})();
