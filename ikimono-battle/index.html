<style>
/* Layout: one narrow column, three views.
   Setup = red / blue corner cards with a life-size comparison against a 170cm person.
   Matchup = VS poster, the tale of the tape, 100 simulated fights, and the tactic pick.
   Fight = a dark test chamber seen from the side; a height grid on the back wall is the scale reference. */
:root {
  --bg: #EEECE8;
  --surface: #FFFFFF;
  --surface-2: #F5F3EF;
  --ink: #121116;
  --muted: #5B5860;
  --line: #D8D4CE;
  --red: #C8102E;
  --red-ink: #AE0C27;
  --blue: #1450C8;
  --blue-ink: #1146B0;
  --on-team: #FFFFFF;
  --hazard: #F5B700;
  --on-hazard: #121116;
  --venom: #7B3FC4;
  --track: rgba(18,17,22,.12);
  --scrim: rgba(10,10,14,.56);
  --arena-top: #272B34;
  --arena-bot: #0E0F13;
  --arena-wall: #1C1F26;
  --arena-grid: rgba(255,255,255,.05);
  --arena-grid2: rgba(255,255,255,.12);
  --arena-floor: #31353E;
  --arena-floor2: #121418;
  --arena-pillar: #0B0C0F;
  --arena-ink: #F4F3F0;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Bebas Neue", "Dela Gothic One", Impact, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0D10; --surface: #16181E; --surface-2: #1D2027; --ink: #F1F0ED; --muted: #A4A1A9; --line: #2C2F38;
    --red: #CF1B3A; --red-ink: #FF7186; --blue: #2B63DB; --blue-ink: #86ABFF; --on-team: #FFFFFF;
    --hazard: #FFC21A; --on-hazard: #121116; --venom: #B286F2; --track: rgba(255,255,255,.12); --scrim: rgba(0,0,0,.68);
    --arena-top: #1B1E25; --arena-bot: #060709; --arena-wall: #13151B; --arena-grid: rgba(255,255,255,.045); --arena-grid2: rgba(255,255,255,.11);
    --arena-floor: #272B33; --arena-floor2: #0A0B0E; --arena-pillar: #050607; --arena-ink: #F4F3F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0D10; --surface: #16181E; --surface-2: #1D2027; --ink: #F1F0ED; --muted: #A4A1A9; --line: #2C2F38;
  --red: #CF1B3A; --red-ink: #FF7186; --blue: #2B63DB; --blue-ink: #86ABFF; --on-team: #FFFFFF;
  --hazard: #FFC21A; --on-hazard: #121116; --venom: #B286F2; --track: rgba(255,255,255,.12); --scrim: rgba(0,0,0,.68);
  --arena-top: #1B1E25; --arena-bot: #060709; --arena-wall: #13151B; --arena-grid: rgba(255,255,255,.045); --arena-grid2: rgba(255,255,255,.11);
  --arena-floor: #272B33; --arena-floor2: #0A0B0E; --arena-pillar: #050607; --arena-ink: #F4F3F0;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font: 400 21px/1.15 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 0; font-size: 13px; color: var(--muted); }
.top h1 small { display: block; font: 700 11.5px/1.3 var(--font-body); color: var(--muted); letter-spacing: .04em; margin-top: 4px; }

.btn {
  font: 700 14px/1.2 var(--font-body);
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-align: center;
}
.btn:hover { border-color: var(--ink); }
.btn:focus-visible, .tb:focus-visible, .spb:focus-visible, .chip:focus-visible, .res:focus-visible, .seg input:focus-visible + label, .tac-opts input:focus-visible + label { outline: 3px solid var(--hazard); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font: 400 19px/1.1 var(--font-display); letter-spacing: .05em; padding: 15px; }
.btn.fight { background: var(--hazard); color: var(--on-hazard); border-color: var(--hazard); font: 400 26px/1 var(--font-display); letter-spacing: .1em; min-height: 62px; }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg label { text-align: center; padding: 8px 10px; border-radius: 999px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg input:checked + label { background: var(--ink); color: var(--bg); }

/* fighter cards */
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.fcard.flash { animation: flash .9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 6px var(--hazard); } to { box-shadow: 0 0 0 0 transparent; } }
.fc-band { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 14px; color: var(--on-team); font: 400 13px/1.2 var(--font-display); letter-spacing: .08em; }
.fcard[data-team="0"] .fc-band { background: var(--red); }
.fcard[data-team="1"] .fc-band { background: var(--blue); }
.fc-band small { font: 700 12px/1 var(--font-body); letter-spacing: .04em; }
.fc-body { padding: 12px 14px 14px; display: grid; gap: 10px; }
.fc-top { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 12px; align-items: stretch; }
.scale-cv { width: 112px; height: 128px; display: block; border-radius: 10px; background: var(--surface-2); }
.ident { min-width: 0; display: grid; align-content: start; gap: 2px; }
.ident .ttl { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }
.ident h2 { margin: 0; font: 400 21px/1.2 var(--font-display); overflow-wrap: anywhere; }
.ident .kind { margin: 0; color: var(--muted); font-size: 12px; }
.ident .scale { margin: 6px 0 0; font-size: 12px; font-variant-numeric: tabular-nums; }
.ident .scale b { display: block; font: 400 30px/1 var(--font-num); letter-spacing: .03em; }
.ident .src { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { font-size: 10.5px; color: var(--muted); letter-spacing: .02em; }
.facts dd { margin: 0; font: 700 15px/1.3 var(--font-body); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats { display: grid; gap: 4px; }
.stat { display: grid; grid-template-columns: 4.6em minmax(0,1fr) 1.6em; align-items: center; gap: 8px; font-size: 12px; }
.stat .num { font: 400 15px/1 var(--font-num); text-align: right; letter-spacing: .04em; }
.meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.meter i { height: 8px; border-radius: 1px; background: var(--track); transform: skewX(-14deg); }
.fcard[data-team="0"] .meter i.on { background: var(--red); }
.fcard[data-team="1"] .meter i.on { background: var(--blue); }
.arms { margin: 0; display: grid; gap: 6px; font-size: 13.5px; }
.arms p { margin: 0; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.lbl { font: 700 11px/1 var(--font-body); letter-spacing: .06em; background: var(--ink); color: var(--bg); padding: 4px 6px; border-radius: 4px; align-self: center; flex: none; }
.lbl.sp { background: var(--hazard); color: var(--on-hazard); }
.venom-tag { font: 700 11px/1 var(--font-body); color: var(--on-team); background: var(--venom); padding: 4px 6px; border-radius: 4px; align-self: center; }
.arms b { font-weight: 900; }
.arms small { color: var(--muted); font-size: 12px; flex-basis: 100%; }
.comment { margin: 0; font-size: 12.5px; color: var(--muted); }
.fc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.fc-actions .btn { flex: 1 1 auto; }
.vs-div { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 400 16px/1 var(--font-num); letter-spacing: .2em; margin: -4px 0; }
.vs-div::before, .vs-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.note.warn { color: var(--red-ink); }

/* matchup */
#viewVs { display: grid; gap: 12px; }
.poster { position: relative; border-radius: 16px; overflow: hidden; color: var(--on-team); background: linear-gradient(112deg, var(--red) 0 49.6%, var(--ink) 49.6% 50.4%, var(--blue) 50.4% 100%); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.poster .side { position: relative; min-width: 0; display: grid; justify-items: center; align-content: end; padding: 10px 8px 12px; text-align: center; }
.poster canvas { width: 100%; max-width: 168px; aspect-ratio: 1; display: block; }
.poster .ptitle { margin: 4px 0 0; font: 700 11.5px/1.3 var(--font-body); opacity: .92; overflow-wrap: anywhere; }
.poster h2 { margin: 0; font: 400 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.poster .vsmark { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-8deg); font: 400 56px/1 var(--font-num); letter-spacing: .02em; color: var(--hazard); -webkit-text-stroke: 2px #0b0b0e; paint-order: stroke fill; pointer-events: none; }
.tape { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 13px; }
.tape caption { text-align: left; font: 400 14px/1.2 var(--font-display); padding: 0 0 8px; }
.tape th { width: 30%; font-size: 11px; font-weight: 700; color: var(--muted); padding: 7px 4px; text-align: center; }
.tape td { padding: 7px 10px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; vertical-align: middle; }
.tape td.l { text-align: right; }
.tape td.r { text-align: left; }
.tape tr + tr > * { border-top: 1px solid var(--line); }
.tape td small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.tape td.win { font-weight: 900; }
.tape td.l.win { color: var(--red-ink); box-shadow: inset -3px 0 0 var(--red); }
.tape td.r.win { color: var(--blue-ink); box-shadow: inset 3px 0 0 var(--blue); }
.odds { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.odds-head { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 400 14px/1.2 var(--font-display); }
.odds-head span:last-child { font: 400 16px/1 var(--font-num); letter-spacing: .05em; color: var(--muted); }
.odds-bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--track); }
.odds-bar i { display: block; height: 100%; transition: width .25s ease-out; }
.odds-bar .o0 { background: var(--red); }
.odds-bar .od { background: var(--muted); opacity: .45; }
.odds-bar .o1 { background: var(--blue); }
.odds-txt { margin: 0; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: baseline; font-size: 12.5px; }
.odds-txt b { font: 400 26px/1 var(--font-num); letter-spacing: .03em; }
.odds-txt .t0 { color: var(--red-ink); }
.odds-txt .t1 { color: var(--blue-ink); text-align: right; }
.odds-txt .dr { color: var(--muted); text-align: center; font-size: 11.5px; }
.odds-txt span { display: block; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.point { margin: 0; font-size: 13px; }
.tac-pick { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: grid; gap: 8px; }
.tac-pick legend { padding: 0 4px; font: 400 14px/1.2 var(--font-display); }
.tac-pick legend small { font: 700 11.5px/1 var(--font-body); color: var(--muted); margin-left: 6px; }
.tac-opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.tac-opts label { display: grid; gap: 2px; padding: 9px 8px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; text-align: center; background: var(--surface-2); min-height: 44px; }
.tac-opts label b { font: 400 15px/1.2 var(--font-display); }
.tac-opts label small { font-size: 11px; color: var(--muted); line-height: 1.35; }
.tac-opts input:checked + label { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tac-opts input:checked + label small { color: inherit; opacity: .8; }
.rps { margin: 0; font-size: 11.5px; color: var(--muted); }

/* fight */
#viewBattle { display: flex; flex-direction: column; gap: 8px; }
.hud { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: center; }
.hs { min-width: 0; display: grid; gap: 4px; }
.hs .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hs.r .nm { flex-direction: row-reverse; }
.hs b { font: 400 14px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tag { font: 700 11px/1 var(--font-body); padding: 4px 6px; border-radius: 4px; color: var(--on-team); flex: none; }
.tag.t0 { background: var(--red); } .tag.t1 { background: var(--blue); }
/* both health bars are anchored at the clock and drain toward the outer edge */
.hpbar { position: relative; height: 13px; background: var(--track); border-radius: 2px; overflow: hidden; transform: skewX(-12deg) scaleX(-1); }
.hs.r .hpbar { transform: skewX(12deg); }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; width: 100%; }
.hpbar .lag { background: var(--hazard); }
#hs0 .hpbar .cur { background: var(--red); } #hs1 .hpbar .cur { background: var(--blue); }
.hpbar.low .cur { animation: low .5s ease-in-out infinite alternate; }
@keyframes low { to { opacity: .55; } }
.sub { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px; align-items: center; }
.hs.r .sub { grid-template-columns: minmax(0,1fr) auto; }
.hs.r .sub .tac { order: 2; }
.tac { font: 700 11px/1 var(--font-body); color: var(--muted); white-space: nowrap; }
.minibars { display: grid; gap: 2px; }
.mini { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; display: flex; }
.hs:not(.r) .mini { justify-content: flex-end; }
.mini i { display: block; height: 100%; width: 100%; }
.mini.st i { background: var(--muted); }
.mini.gg i { background: var(--hazard); }
.clock { font: 400 34px/1 var(--font-num); letter-spacing: .02em; font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: center; }
.clock.hurry { color: var(--red-ink); }
.stage { border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; width: 100%; max-width: 100%; background: var(--arena-bot); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
#bMsg { margin: 0; font-size: 13.5px; font-weight: 700; min-height: 1.6em; }
.controls { display: grid; gap: 10px; grid-template-columns: 1fr; }
.controls.two { grid-template-columns: 1fr 1fr; }
.pad { display: grid; gap: 8px; min-width: 0; }
.pad .who { margin: 0; font: 700 12px/1 var(--font-body); color: var(--muted); }
.tacs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.tb {
  font: 400 14px/1.15 var(--font-display);
  min-height: 46px; min-width: 0; padding: 4px;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  cursor: pointer; touch-action: manipulation;
}
.controls.two .tb { font-size: 12px; min-height: 44px; white-space: nowrap; letter-spacing: -0.03em; padding: 2px; }
.tb[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.spb {
  position: relative; overflow: hidden;
  min-height: 58px; min-width: 0; padding: 6px 10px;
  border-radius: 12px; border: 0;
  background: var(--track); color: var(--ink);
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: grid; align-content: center; gap: 2px; text-align: center;
}
.spb .spf { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: color-mix(in srgb, var(--hazard) 45%, transparent); }
.spb .spl, .spb .spn { position: relative; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spb .spl { font: 700 11px/1.2 var(--font-body); color: var(--muted); }
.spb .spn { font: 400 16px/1.2 var(--font-display); }
.controls.two .spb .spn { font-size: 13px; }
.spb:disabled { cursor: default; }
.spb:disabled .spn { opacity: .6; }
.spb.ready { background: var(--hazard); color: var(--on-hazard); }
.spb.ready .spl { color: var(--on-hazard); }
.spb.chance { animation: cue .45s ease-in-out infinite alternate; }
@keyframes cue { to { box-shadow: 0 0 0 6px color-mix(in srgb, var(--hazard) 55%, transparent); } }
.spb:active:not(:disabled) { transform: scale(.98); }
.util { display: flex; gap: 8px; flex-wrap: wrap; }
.util .btn { flex: 1 1 auto; }
.keys { margin: 0; font-size: 11px; color: var(--muted); }
@media (hover: none) { .keys { display: none; } }

/* sheets */
.sheet { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet-panel {
  background: var(--surface); color: var(--ink);
  width: min(480px, 100%);
  max-height: 90%;
  overflow: auto;
  border-radius: 18px 18px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 16px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 12px;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font: 400 18px/1.2 var(--font-display); }
.search-input { font: 400 16px/1.3 var(--font-body); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.search-input:focus-visible { outline: 3px solid var(--hazard); outline-offset: 1px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 700 12.5px/1 var(--font-body); padding: 9px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }

<div id="app">

      <button class="btn primary" id="btnToVs" type="button">対戦カードを組む</button>

  </main>

  <section id="viewVs" hidden aria-labelledby="vsHead">

  x.restore();
  if (R && R.winner != null) {
    x.save(); x.translate(R.winner === 0 ? 150 : 1050, 170); x.rotate(-0.12);
    x.fillStyle = '#F5B700'; x.fillRect(-82, -38, 164, 76);
    x.font = `64px ${NUM_FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#0b0b0e'; x.fillText('WIN', 0, 4);
    x.restore();
  }
  if (R && R.upset) {
    x.save(); x.translate(610, 140); x.rotate(-0.05);
    x.font = `30px ${DISPLAY_FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const w = x.measureText('番狂わせ！').width + 36;
    x.fillStyle = '#F5B700'; x.fillRect(-w / 2, -26, w, 52); x.fillStyle = '#0b0b0e'; x.fillText('番狂わせ！', 0, 2);
    x.restore();
  }
  x.fillStyle = 'rgba(8,8,10,.88)'; x.fillRect(0, 548, W, 82);
  x.textBaseline = 'middle'; x.textAlign = 'left';
  let lx = 40;
  if (hl) {
    x.font = `${hl.kick === '判定' ? 40 : 54}px ${NUM_FONT}`; x.fillStyle = '#F5B700'; x.fillText(hl.kick, lx, 591);
    lx += x.measureText(hl.kick).width + 22;
    const fs = fitFont(x, hl.main, DISPLAY_FONT, 28, 620 - lx);
    x.fillStyle = '#ffffff'; x.fillText(hl.main, lx, hl.sub ? 574 : 589);
    if (hl.sub) { x.font = `700 20px ${BF}`; x.fillStyle = 'rgba(255,255,255,.8)'; x.fillText(hl.sub, lx, 608); }
    void fs;
  } else {
    x.font = `28px ${DISPLAY_FONT}`; x.fillStyle = '#ffffff'; x.fillText('208種から選んで、自動でバトル', lx, 589);
  }
  if (o.odds) {
    const n = Math.max(1, o.odds.n), pa = Math.round(o.odds.wa / n * 100), pb = Math.round(o.odds.wb / n * 100);
    x.textAlign = 'right'; let rx = W - 40;
    x.font = `46px ${NUM_FONT}`;
    const parts = [[`${pb}勝`, '#7FA6FF'], [' : ', '#ffffff'], [`${pa}勝`, '#FF7186']];
    for (const [t, col] of parts) { x.fillStyle = col; x.fillText(t, rx, 594); rx -= x.measureText(t).width; }
    x.font = `700 18px ${BF}`; x.fillStyle = 'rgba(255,255,255,.75)'; x.fillText('100回戦うと', rx - 14, 594);
  }
  return c;
}
let shareBusy = false;
async function shareCard() {
  if (shareBusy || !M) return;
  shareBusy = true;
  const note = $('#shareNote');
  note.textContent = '画像を作っています…';
  try {
    const R = M.result, odds = oddsCache.get(pairKey());
    const c = await makeCard({ a: fighters[0], b: fighters[1], result: { winner: R ? R.winner : null, upset: M.upset }, hl: headline(R), odds });
    const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('blob'))), 'image/png'));
    const file = new File([blob], `ikimono-battle-${Date.now()}.png`, { type: 'image/png' });
    const url = matchUrl(), text = `${resultText(R, odds, M.upset)}\n#${HASHTAG}${url ? `\n${url}` : ''}`;
    if (canShareFiles()) {
      try { await navigator.share({ files: [file], text }); note.textContent = ''; return; }
      catch (e) { if (e && e.name === 'AbortError') { note.textContent = ''; return; } }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    note.textContent = '画像を保存しました。Xに投稿するときに添付できます。';
  } catch {
    note.textContent = 'このページでは画像を保存できませんでした。';
  } finally { shareBusy = false; }
}
$('#btnShareImg').addEventListener('click', shareCard);
// a shared link like ?a=カブトムシ&b=ライオン opens that matchup
function fromQuery() {
  let q;
  try { q = new URLSearchParams(location.search); } catch { return false; }
  const find = (v) => { if (!v) return null; const n = norm(v); return DEX.find((d) => d.name === v) || DEX.find((d) => d.keys.main.includes(n)) || null; };
  const a = find(q.get('a')), b = find(q.get('b'));
  if (a) fighters[0] = toFighter(a);
  if (b) fighters[1] = toFighter(b);
  return !!(a && b);
}

/* ---------- boot ---------- */
renderSound();
if (fromQuery()) openVs(); else { showView('setup'); renderSlots(); }
if (document.fonts && document.fonts.load) {
  Promise.all(['20px "Dela Gothic One"', '20px "Bebas Neue"', '12px "Zen Kaku Gothic New"'].map((f) => document.fonts.load(f))).then(() => {
    spriteCache.clear();
    if (!$('#viewSetup').hidden) renderSlots();
    if (!$('#viewVs').hidden) renderVs();
  }).catch(() => {});
}
})();
